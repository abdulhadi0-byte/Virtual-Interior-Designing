<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Virtual Interior Designing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="main-inner narrow">
        <div class="page-header">
          <div>
            <h1>Profile</h1>
            <p>Manage your personal information</p>
          </div>
        </div>

        <form class="card card-pad" id="profileForm">
          <div class="avatar-row">
            <div class="avatar" id="avatarWrap">
              <span id="avatarInitial">?</span>
              <img id="avatarImg" style="display:none;" />
              <div class="avatar-cam" id="avatarCamBtn">
                <svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px;">
                  <path d="M9 3.5L7.8 5H5a2 2 0 00-2 2v10.5A2 2 0 005 19.5h14a2 2 0 002-2V7a2 2 0 00-2-2h-2.8L15 3.5H9zm3 5a4.5 4.5 0 110 9 4.5 4.5 0 010-9z"/>
                </svg>
              </div>
              <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
            </div>
            <div>
              <p style="font-weight:600;margin:0;" id="avatarName">Your name</p>
              <p style="font-size:13px;color:var(--muted);margin:2px 0 0;" id="avatarEmail"></p>
            </div>
          </div>

          <div class="field">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Your full name" />
          </div>
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="+92 300 1234567" />
          </div>
          <div class="field">
            <label>Gemini API Key</label>
            <input type="password" id="apiKeyField" placeholder="AIza..." />
          </div>

          <p class="msg" id="profileMsg"></p>

          <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>

        <p style="font-size:12px;color:var(--muted);margin-top:14px;text-align:center;">
          This is a backend-less demo — your info is saved only in this browser's local storage, not a real account.
        </p>
      </div>
    </main>
  </div>

  <script src="js/shared.js"></script>
  <script>
    renderSidebar("profile.html");

    const profile = getProfile();
    document.getElementById("fullName").value = profile.fullName || "";
    document.getElementById("email").value = profile.email || "";
    document.getElementById("phone").value = profile.phone || "";
    document.getElementById("apiKeyField").value = getApiKey();
    document.getElementById("avatarName").textContent = profile.fullName || "Your name";
    document.getElementById("avatarEmail").textContent = profile.email || "";

    function refreshAvatar() {
      const initialEl = document.getElementById("avatarInitial");
      const imgEl = document.getElementById("avatarImg");
      if (profile.avatar) {
        imgEl.src = profile.avatar;
        imgEl.style.display = "block";
        initialEl.style.display = "none";
      } else {
        initialEl.textContent = (profile.fullName || "?")[0].toUpperCase();
        initialEl.style.display = "block";
        imgEl.style.display = "none";
      }
    }
    refreshAvatar();

    document.getElementById("avatarCamBtn").addEventListener("click", () => {
      document.getElementById("avatarInput").click();
    });

    document.getElementById("avatarInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        profile.avatar = reader.result;
        refreshAvatar();
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("profileForm").addEventListener("submit", (e) => {
      e.preventDefault();
      profile.fullName = document.getElementById("fullName").value.trim() || "Guest";
      profile.email = document.getElementById("email").value.trim();
      profile.phone = document.getElementById("phone").value.trim();
      saveProfile(profile);

      const key = document.getElementById("apiKeyField").value.trim();
      if (key) setApiKey(key);

      const msg = document.getElementById("profileMsg");
      msg.textContent = "Profile updated.";
      msg.className = "msg msg-success";
      setTimeout(() => (msg.textContent = ""), 2500);
    });
  </script>
</body>
</html>
